name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Microservices Image
        run: |
          docker build -t food-ordering-webapp:latest ./backend

      - name: Test Docker Image
        run: |
          docker run --rm food-ordering-webapp:latest echo "Image is valid!"

      - name: Login to Docker Hub
        # Only run this step if Docker Hub credentials are set in GitHub Secrets
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          docker tag food-ordering-webapp:latest ${{ secrets.DOCKERHUB_USERNAME }}/food-ordering-webapp:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/food-ordering-webapp:latest
