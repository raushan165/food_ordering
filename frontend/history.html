<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order History - TastyEats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🍔 TastyEats</a>
            <a href="index.html" class="text-white text-decoration-none">Back to Menu</a>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">My Order History</h2>
        <div id="history-container" class="row g-4"></div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) window.location.href = 'auth.html';

        async function fetchHistory() {
            const res = await fetch(`/api/orders/history/${user.email}`);
            const orders = await res.json();
            const container = document.getElementById('history-container');
            
            if (orders.length === 0) {
                container.innerHTML = '<p class="text-muted">You have no past orders.</p>';
                return;
            }

            container.innerHTML = orders.map(o => `
                <div class="col-md-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center">
                            <small class="text-muted">${new Date(o.createdAt).toLocaleString()}</small>
                            <span class="badge ${o.status === 'Pending' ? 'bg-warning text-dark' : 'bg-success'}">${o.status}</span>
                        </div>
                        <div class="card-body">
                            <ul class="list-unstyled">
                                ${o.items.map(i => `<li>${i.qty}x ${i.name}</li>`).join('')}
                            </ul>
                            <h5 class="text-end fw-bold text-danger mt-3">Total: ₹${o.totalAmount}</h5>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        fetchHistory();
    </script>
</body>
</html>
