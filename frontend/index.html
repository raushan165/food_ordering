<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Food Ordering - Microservices</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🍔 TastyEats</a>
            <div class="d-flex text-white align-items-center">
                <span id="user-profile" class="me-3">Loading User...</span>
                <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#cartModal">
                    🛒 Cart (<span id="cart-count">0</span>) - ₹<span id="cart-total">0</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4 text-center">Our Menu</h2>
        <div class="text-center mb-4">
            <button id="seed-btn" class="btn btn-outline-danger">Seed Database (Mock Data)</button>
        </div>
        <div id="menu-container" class="row g-4">
            <!-- Menu items injected here by app.js -->
        </div>
    </div>

    <!-- Cart Modal -->
    <div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="cartModalLabel">Your Order</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="cart-items">
                        <p class="text-muted">Your cart is empty.</p>
                    </div>
                    <hr>
                    <h5 class="text-end">Total: ₹<span id="modal-total">0</span></h5>
                    
                    <div class="mt-3">
                        <label class="form-label">Name</label>
                        <input type="text" id="cust-name" class="form-control" placeholder="John Doe">
                    </div>
                    <div class="mt-2">
                        <label class="form-label">Address</label>
                        <textarea id="cust-address" class="form-control" placeholder="123 Main St"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-success" id="checkout-btn">Checkout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.css"></script>
    <script src="app.js"></script>
</body>
</html>
