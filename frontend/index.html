<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Menu - TastyEats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🍔 TastyEats</a>
            <div class="d-flex text-white align-items-center gap-3">
                <a href="history.html" class="text-white text-decoration-none">Order History</a>
                <a href="feedback.html" class="text-white text-decoration-none">Feedback</a>
                <span id="user-name" class="fw-bold text-warning"></span>
                <a href="cart.html" class="btn btn-warning">🛒 Cart (<span id="cart-count">0</span>)</a>
                <button onclick="logout()" class="btn btn-sm btn-outline-light">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4 text-center">Dashboard / Menu</h2>
        <div class="text-center mb-4">
            <button onclick="seedMenu()" class="btn btn-outline-danger">Seed Database (Mock Data)</button>
        </div>
        <div id="menu-container" class="row g-4"></div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const user = JSON.parse(localStorage.getItem('user'));
        
        if (!user) window.location.href = 'auth.html';
        document.getElementById('user-name').innerText = `Hi, ${user.name}`;
        updateCartCount();

        async function fetchMenu() {
            const res = await fetch('/api/menu');
            const items = await res.json();
            const container = document.getElementById('menu-container');
            container.innerHTML = items.map(i => `
                <div class="col-md-4">
                    <div class="card h-100 shadow-sm border-0 food-card">
                        <img src="${i.imageUrl}" class="card-img-top" style="height:200px;object-fit:cover;">
                        <div class="card-body d-flex flex-column">
                            <h5 class="fw-bold">${i.name}</h5>
                            <p class="text-muted flex-grow-1">${i.description}</p>
                            <div class="d-flex justify-content-between align-items-center mt-3">
                                <span class="fs-5 fw-bold text-danger">₹${i.price}</span>
                                <button class="btn btn-outline-danger" onclick="addToCart('${i._id}', '${i.name}', ${i.price})">Add</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id, name, price) {
            const existing = cart.find(c => c._id === id);
            if (existing) existing.qty += 1;
            else cart.push({ _id: id, name, price, qty: 1 });
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
        }

        function updateCartCount() {
            document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
        }

        async function seedMenu() {
            await fetch('/api/menu/seed', { method: 'POST' });
            alert('Seeded!');
            fetchMenu();
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'auth.html';
        }

        fetchMenu();
    </script>
</body>
</html>
