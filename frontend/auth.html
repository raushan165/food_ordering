<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auth - TastyEats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 400px;">
        <h2 class="text-center text-danger fw-bold mb-4">🍔 TastyEats</h2>
        
        <!-- Login Form -->
        <div id="login-section" class="card p-4 shadow-sm border-0">
            <h4 class="mb-3 text-center">Login</h4>
            <div class="mb-3">
                <input type="email" id="login-email" class="form-control" placeholder="Email (use admin@ for Admin)">
            </div>
            <div class="mb-3">
                <input type="password" id="login-pass" class="form-control" placeholder="Password">
            </div>
            <button onclick="login()" class="btn btn-danger w-100">Login</button>
            <p class="mt-3 text-center text-muted">No account? <a href="#" onclick="toggle('register')">Register here</a></p>
        </div>

        <!-- Register Form -->
        <div id="register-section" class="card p-4 shadow-sm border-0 d-none">
            <h4 class="mb-3 text-center">Create Account</h4>
            <div class="mb-3">
                <input type="text" id="reg-name" class="form-control" placeholder="Full Name">
            </div>
            <div class="mb-3">
                <input type="email" id="reg-email" class="form-control" placeholder="Email">
            </div>
            <div class="mb-3">
                <input type="password" id="reg-pass" class="form-control" placeholder="Password">
            </div>
            <button onclick="register()" class="btn btn-danger w-100">Register</button>
            <p class="mt-3 text-center text-muted">Have an account? <a href="#" onclick="toggle('login')">Login here</a></p>
        </div>
    </div>

    <script>
        function toggle(type) {
            document.getElementById('login-section').classList.toggle('d-none', type === 'register');
            document.getElementById('register-section').classList.toggle('d-none', type === 'login');
        }

        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-pass').value;
            try {
                const res = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = data.user.role === 'Admin' ? 'admin.html' : 'index.html';
                } else alert(data.error);
            } catch (e) { alert('Login failed'); }
        }

        async function register() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-pass').value;
            try {
                const res = await fetch('/api/users/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = data.user.role === 'Admin' ? 'admin.html' : 'index.html';
                } else alert(data.error);
            } catch (e) { alert('Registration failed'); }
        }
    </script>
</body>
</html>
