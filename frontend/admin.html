<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - TastyEats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="#">👑 Admin Portal</a>
            <div class="d-flex text-white align-items-center gap-3">
                <span id="user-name" class="fw-bold"></span>
                <button onclick="logout()" class="btn btn-sm btn-outline-light">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">All Orders</h2>
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>Customer</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="admin-orders"></tbody>
            </table>
        </div>

        <h2 class="mt-5 mb-4">Customer Feedbacks</h2>
        <div id="admin-feedback" class="row g-4"></div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role !== 'Admin') {
            alert('Access Denied');
            window.location.href = 'auth.html';
        }
        document.getElementById('user-name').innerText = user.name;

        async function fetchAdminData() {
            const [ordersRes, fbRes] = await Promise.all([
                fetch('/api/orders'),
                fetch('/api/users/feedback')
            ]);
            
            const orders = await ordersRes.json();
            const feedbacks = await fbRes.json();

            // Render Orders
            document.getElementById('admin-orders').innerHTML = orders.map(o => `
                <tr>
                    <td>${new Date(o.createdAt).toLocaleString()}</td>
                    <td><b>${o.customerName}</b><br><small>${o.customerAddress}</small><br><small class="text-primary">${o.userEmail}</small></td>
                    <td>${o.items.map(i => `${i.qty}x ${i.name}`).join('<br>')}</td>
                    <td class="fw-bold">₹${o.totalAmount}</td>
                    <td><span class="badge ${o.status === 'Delivered' ? 'bg-success' : 'bg-warning text-dark'}">${o.status}</span></td>
                    <td>
                        ${o.status === 'Pending' ? `<button onclick="updateStatus('${o._id}', 'Delivered')" class="btn btn-sm btn-success">Mark Delivered</button>` : ''}
                    </td>
                </tr>
            `).join('');

            // Render Feedbacks
            document.getElementById('admin-feedback').innerHTML = feedbacks.map(f => `
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="fw-bold">${f.name} <small class="text-muted fw-normal">(${f.email})</small></h6>
                            <p class="mb-0">"${f.message}"</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function updateStatus(id, status) {
            await fetch(`/api/orders/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            fetchAdminData();
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'auth.html';
        }

        fetchAdminData();
    </script>
</body>
</html>
